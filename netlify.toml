[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers (CSP, X-Frame-Options, Referrer-Policy, Permissions-Policy)
# live in next.config.ts, not here — every route in this app is served
# through the Next.js server function under @netlify/plugin-nextjs, and
# netlify.toml's [[headers]] only reliably reach genuinely static assets.
# Confirmed live: declaring them here alone had zero effect on page
# responses. Strict-Transport-Security and X-Content-Type-Options are
# already sent by Netlify's own platform defaults.
